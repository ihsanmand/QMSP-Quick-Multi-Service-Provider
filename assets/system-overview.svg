<svg xmlns="http://www.w3.org/2000/svg" width="920" height="390" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">QMSP high-level system overview</title>
  <desc id="desc">Next.js web and Flutter Android clients connect to a Django platform backed by PostgreSQL and Redis</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="920" height="390" rx="8" fill="#07111f"/>
  <text x="42" y="47" fill="#e8f5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">PUBLIC SYSTEM BOUNDARIES</text>
  <text x="42" y="74" fill="#708aa1" font-family="Segoe UI, Arial, sans-serif" font-size="14">Intentionally excludes endpoints, schemas, security thresholds, and production topology</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="60" y="118" width="210" height="82" rx="7" fill="#0d1e31" stroke="#22d3ee"/>
    <text x="165" y="153" fill="#dff7ff" font-size="19" text-anchor="middle" font-weight="600">Next.js Web</text>
    <text x="165" y="178" fill="#8ba5ba" font-size="13" text-anchor="middle">Customer · Provider · Admin</text>
    <rect x="60" y="236" width="210" height="82" rx="7" fill="#0d1e31" stroke="#3b82f6"/>
    <text x="165" y="271" fill="#e5efff" font-size="19" text-anchor="middle" font-weight="600">Flutter Android</text>
    <text x="165" y="296" fill="#8ba5ba" font-size="13" text-anchor="middle">Customer · Provider</text>
    <rect x="355" y="155" width="230" height="126" rx="7" fill="#10253b" stroke="url(#accent)" stroke-width="2"/>
    <text x="470" y="198" fill="#eff9ff" font-size="21" text-anchor="middle" font-weight="700">Django Platform</text>
    <text x="470" y="226" fill="#9db3c6" font-size="14" text-anchor="middle">Marketplace · Authorization</text>
    <text x="470" y="249" fill="#9db3c6" font-size="14" text-anchor="middle">Lifecycle · Validation · Audit</text>
    <rect x="670" y="118" width="190" height="82" rx="7" fill="#0d1e31" stroke="#38bdf8"/>
    <text x="765" y="153" fill="#e8f8ff" font-size="19" text-anchor="middle" font-weight="600">PostgreSQL</text>
    <text x="765" y="178" fill="#8ba5ba" font-size="13" text-anchor="middle">Transactional data</text>
    <rect x="670" y="236" width="190" height="82" rx="7" fill="#0d1e31" stroke="#60a5fa"/>
    <text x="765" y="271" fill="#e8f2ff" font-size="19" text-anchor="middle" font-weight="600">Redis</text>
    <text x="765" y="296" fill="#8ba5ba" font-size="13" text-anchor="middle">Coordination · Real-time</text>
  </g>
